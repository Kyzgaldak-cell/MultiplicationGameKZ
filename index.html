<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Көбейту кестесін үйренейік!</title>
    <style>
        body {
            font-family: "Comic Sans MS", Arial, sans-serif;
            text-align: center;
            background-color: #f0f8ff;
        }
        .container {
            background: white;
            width: 450px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.2);
        }
        .level-buttons button {
            padding: 12px;
            margin: 5px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
        }
        input {
            padding: 12px;
            width: 120px;
            font-size: 22px;
            text-align: center;
            margin-top: 10px;
            border-radius: 6px;
        }
        .keypad button {
            width: 30%;
            padding: 12px;
            font-size: 22px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #4caf50;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Көбейту кестесін үйренейік! 📖</h1>
        <p>Дұрыс жауапты теріңіз!</p>

        <div class="level-buttons">
            <button onclick="setLevel('1-5')">1-5</button>
            <button onclick="setLevel('6-10')">6-10</button>
            <button onclick="setLevel('Барлығы')">Барлығы</button>
        </div>

        <div class="exercise">
            <div class="numbers">
                <span id="num1"></span> × <span id="num2"></span>
            </div>
            <input type="number" id="answer" placeholder="Жауап" readonly />
            <div class="keypad">
                <button onclick="addNumber(1)">1</button>
                <button onclick="addNumber(2)">2</button>
                <button onclick="addNumber(3)">3</button>
                <button onclick="addNumber(4)">4</button>
                <button onclick="addNumber(5)">5</button>
                <button onclick="addNumber(6)">6</button>
                <button onclick="addNumber(7)">7</button>
                <button onclick="addNumber(8)">8</button>
                <button onclick="addNumber(9)">9</button>
                <button onclick="clearAnswer()">⌫</button>
                <button onclick="addNumber(0)">0</button>
                <button onclick="checkAnswer()">✔</button>
            </div>
        </div>

        <div id="feedback"></div>
        <p>Дұрыс жауаптар: <span id="score">0</span></p>
        <audio id="correctSound" src="correct.mp3"></audio>
        <audio id="wrongSound" src="wrong.mp3"></audio>
    </div>
    <script>
        let level = '1-5';
        let score = 0;

        function setLevel(selectedLevel) {
            level = selectedLevel;
            generateExercise();
        }

        function generateExercise() {
            let num1, num2;
            if (level === '1-5') {
                num1 = getRandom(1, 5);
                num2 = getRandom(1, 10);
            } else if (level === '6-10') {
                num1 = getRandom(6, 10);
                num2 = getRandom(1, 10);
            } else {
                num1 = getRandom(1, 10);
                num2 = getRandom(1, 10);
            }
            document.getElementById('num1').textContent = num1;
            document.getElementById('num2').textContent = num2;
            document.getElementById('answer').value = "";
            document.getElementById('feedback').innerHTML = "";
        }

        function checkAnswer() {
            let num1 = parseInt(document.getElementById('num1').textContent);
            let num2 = parseInt(document.getElementById('num2').textContent);
            let userAnswer = parseInt(document.getElementById('answer').value);
            let correctAnswer = num1 * num2;
            let feedback = document.getElementById('feedback');
            let inputField = document.getElementById('answer');
            
            if (userAnswer === correctAnswer) {
                feedback.textContent = "✅ Дұрыс!";
                feedback.style.color = "green";
                document.getElementById('correctSound').play();
                score++;
                document.getElementById('score').textContent = score;
            } else {
                feedback.textContent = "❌ Қате! Дұрыс жауап: " + correctAnswer;
                feedback.style.color = "red";
                document.getElementById('wrongSound').play();
            }
            
            setTimeout(() => {
                generateExercise();
            }, 1000);
        }

        function addNumber(num) {
            document.getElementById('answer').value += num;
        }

        function clearAnswer() {
            document.getElementById('answer').value = "";
        }

        function getRandom(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        generateExercise();
    </script>
</body>
</html>
